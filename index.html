function ld(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function mk(n,k){return sh(BANK[n]).slice(0,k).map(function(q){var o=sh(q[1].map(function(x,i){return{t:x,c:i===q[2]}}));return{q:q[0],o:o.map(function(x){return x.t}),a:o.findIndex(function(x){return x.c}),n:n}})}
function sb(n,k){var qs=mk(n,k);return{n:n,qs:qs,ans:qs.map(function(){return-1}),i:0}}
function pct(x){var c=0;x.qs.forEach(function(q,j){if(x.ans[j]===q.a)c++});return{c:c,p:x.qs.length?c/x.qs.length*100:0}}
function tile(e,b,s,a,v){return '<button class="tile" data-a="'+a+'"'+(v?' data-v="'+v+'"':'')+'><span class="e">'+e+'</span><b>'+b+'</b><span>'+s+'</span></button>'}
function render(){
 var h="",v=st.v;
 navEl.style.display=v==="test"?"none":"flex";
 var nv=[["home","🏠","Home"],["setup","✏️","Practice"],["syl","📚","Syllabus"],["prog","📈","Progress"],["more","⋯","More"]];
 navEl.innerHTML=nv.map(function(n){var cur=(v===n[0]||(v==="result"&&n[0]==="home")||(v==="plan"&&n[0]==="more"));return '<button data-a="nav" data-v="'+n[0]+'"'+(cur?' aria-current="page"':'')+'><span class="e">'+n[1]+'</span>'+n[2]+'</button>'}).join("");
 if(v!=="test")tm.hidden=true;
 if(v==="home"){
  var tot=0;for(var k in BANK)tot+=BANK[k].length;var w=ld("kukuW").length;
  h='<div class="hero"><h1>KUKU CBT TEST</h1><p>Free JAMB-style practice for Science, Art and Commercial students.</p><span class="pill">'+tot+' questions</span><span class="pill">13 subjects</span><span class="pill">Syllabus included</span></div><div class="act">'+tile("📝","Full mock","180 questions, 4 subjects","full")+tile("🎯","Subject practice","Instant feedback","prac")+tile("🔁","My mistakes",w+" saved to retry","mist")+tile("🗓️","Study plan","A weekly timetable","plan")+'</div>';
  h+='<div class="card"><h2>Share KUKU CBT TEST</h2><p class="note">Send the link to friends so every student can practise for free.</p><div class="row"><button class="btn pri" data-a="share">Share app</button></div>'+(st.msg?'<div class="msg">'+st.msg+'</div>':'')+'</div>'}
 else if(v==="setup"){
  if(st.mode==="mock"){
   h='<div class="card"><h2>Full mock setup</h2><div class="qn">1. Pick a department (fills your subjects)</div><div class="chips">'+Object.keys(STR).map(function(n){return chip(n,false,"stream")}).join("")+'</div><div class="qn" style="margin-top:14px">2. Your 4 subjects: English is fixed, pick 3 more ('+(st.picks.length+1)+'/4)</div><div class="chips"><button class="chip" aria-pressed="true" disabled>Use of English</button>'+SUBJ.slice(1).map(function(s){return chip(s,st.picks.indexOf(s)>-1,"pick")}).join("")+'</div><div class="qn" style="margin-top:14px">3. Time</div><div class="chips">'+[35,60,120].map(function(m){return chip(m,st.mins===m,"mins",m+" min")}).join("")+'</div><p class="note">The real UTME gives 120 minutes for 180 questions. Subjects with fewer questions in our bank use all they have.</p><div class="row"><button class="btn pri" data-a="start"'+(st.picks.length===3?"":" disabled")+'>Start full mock</button></div></div><div class="row"><button class="btn" data-a="tprac">Switch to subject practice</button></div>'}
  else{
   h='<div class="card"><h2>Subject practice</h2><div class="qn">Pick a subject. You see the answer right after each question.</div><div class="chips">'+SUBJ.map(function(s){return chip(s,s===st.pr,"prsub")}).join("")+'</div><div class="qn" style="margin-top:14px">Number of questions</div><div class="chips">'+[10,20,40].map(function(n){return chip(n,st.pc===n,"pc",n)}).join("")+'</div><div class="row"><button class="btn pri" data-a="start">Start practice</button></div></div><div class="row"><button class="btn" data-a="tmock">Switch to full mock</button></div>'}}
 else if(v==="syl"){
  h='<div class="card"><h2>Syllabus</h2><div class="chips">'+SUBJ.map(function(s){return chip(s,s===st.syl,"sylpick")}).join("")+'</div></div><div class="card"><div class="qn">'+st.syl+': main topics</div><ul>'+SYL[st.syl].split(";").map(function(x){return "<li>"+x+"</li>"}).join("")+'</ul><p class="note">This is a summary. Confirm against the official JAMB syllabus and brochure for your exam year.</p></div>'}
 else if(v==="prog"){
  var R=ld("kukuR"),m=R.filter(function(r){return r.m==="mock"}).slice(0,8).reverse(),ag={};
  R.forEach(function(r){for(var s in r.per){ag[s]=ag[s]||[];ag[s].push(r.per[s])}});
  h='<div class="card"><h2>Your progress</h2>';
  if(!R.length)h+='<p class="note">Take a test and your results show here. They are saved on this device.</p>';
  else{h+='<div class="qn">Last full mocks (score out of 400)</div>'+(m.length?'<div class="bars">'+m.map(function(r){return '<div style="height:'+Math.max(4,r.s/4)+'%" title="'+r.s+'"></div>'}).join("")+'</div><p class="note">'+m.map(function(r){return r.s}).join(" · ")+'</p>':'<p class="note">No full mocks yet.</p>')+'</div><div class="card"><h2>By subject</h2>';
   Object.keys(ag).forEach(function(s){var a=Math.round(ag[s].reduce(function(x,y){return x+y},0)/ag[s].length);h+='<div class="qn">'+s+' · '+a+'%</div><div class="meter"><div style="width:'+a+'%"></div></div><div style="height:8px"></div>'});
   h+='<p class="note">Your lowest bar is the best place to study next.</p>'}
  h+='</div>'}
 else if(v==="more"){
  h='<div class="card"><h2>Tools</h2><div class="act" style="margin-top:0">'+tile("🗓️","Study plan","Weekly timetable","plan")+tile("🔁","My mistakes","Retry what you missed","mist")+'</div></div><div class="card"><h2>Exam tips</h2><ol>'+TIPS.map(function(x){return "<li>"+x+"</li>"}).join("")+'</ol></div><div class="card"><h2>Use it like an app</h2><p class="note">Android (Chrome): menu ⋮ then “Add to Home screen”. iPhone (Safari): Share then “Add to Home Screen”.</p><div class="row"><button class="btn pri" data-a="share">Share with friends</button></div>'+(st.msg?'<div class="msg">'+st.msg+'</div>':'')+'</div>'}
 else if(v==="plan"){
  var p=st.picks.length===3?st.picks:STR["Art (IRS)"],d=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],ss=[ENG,p[0],ENG,p[1],p[2],"Full or half mock","Review mistakes and rest"];
  h='<div class="card"><h2>Your weekly plan</h2><p class="note">Based on English and '+p.join(", ")+'. Change subjects in Practice, then reopen this.</p><table>'+d.map(function(x,i){return "<tr><td><b>"+x+"</b></td><td>"+ss[i]+"</td></tr>"}).join("")+'</table><p class="note">Each day: 1 hour of reading the syllabus topic, then 30 minutes of practice questions, then 15 minutes reviewing mistakes.</p></div>'}
 else if(v==="test"){
  var t=st.t,s=t.subs[t.c],q=s.qs[s.i],a=s.ans[s.i];
  h='<div class="tabs">'+t.subs.map(function(x,k){return '<button class="tab" role="tab" aria-selected="'+(k===t.c)+'" data-a="sub" data-v="'+k+'">'+x.n.replace(" (IRS)","")+'</button>'}).join("")+'</div><div class="card"><div class="qn">Question '+(s.i+1)+' of '+s.qs.length+' · '+s.n+'</div><p class="qt">'+q.q+'</p>';
  q.o.forEach(function(o,k){var c="";if(t.fb&&a>-1)c=k===q.a?" right":(k===a?" wrong":"");else if(a===k)c=" sel";h+='<button class="opt'+c+'" data-a="ans" data-v="'+k+'"><i>'+L[k]+'.</i><span>'+o+'</span></button>'});
  h+='<div class="row"><button class="btn" data-a="prev"'+(s.i===0?" disabled":"")+'>Previous</button><button class="btn pri" data-a="next"'+(s.i===s.qs.length-1?" disabled":"")+'>Next</button></div></div><div class="card"><div class="qn">Question map. Filled boxes are answered.</div><div class="grid">'+s.qs.map(function(_,k){return '<button class="g'+(s.ans[k]>-1?" done":"")+(k===s.i?" cur":"")+'" data-a="go" data-v="'+k+'">'+(k+1)+'</button>'}).join("");
  var un=0;t.subs.forEach(function(x){x.ans.forEach(function(z){if(z<0)un++})});
  h+='</div></div><div class="row"><button class="btn sub" data-a="submit">'+(t.ask?"Tap again to confirm. You can’t change answers after this.":(t.fb?"Finish":"Submit test")+" ("+un+" unanswered)")+'</button></div>'}
 else{
  var r=st.t,tt=0,rows="",n=0;
  r.subs.forEach(function(x){var z=pct(x);tt+=z.p;n+=x.qs.length;rows+="<tr><td>"+x.n+"</td><td>"+z.c+" / "+x.qs.length+"</td><td>"+Math.round(z.p)+"</td></tr>"});
  h='<div class="card"><div class="qn">Your result</div><div class="big">'+(r.mode==="mock"?Math.round(tt*4/r.subs.length)+" / 400":Math.round(tt/r.subs.length)+"%")+'</div><table><tr><th>Subject</th><th>Score</th><th>%</th></tr>'+rows+'</table><p class="note">Mock scores are scaled to 400, like UTME. Wrong answers are saved to “My mistakes”.</p><div class="row"><button class="btn pri" data-a="nav" data-v="home">Home</button></div></div>';
  r.subs.forEach(function(x){h+='<div class="card"><div class="qn">Review: '+x.n+'</div>'+x.qs.map(function(q,j){return '<p class="qt" style="font-size:16px">'+(j+1)+'. '+q.q+'</p>'+q.o.map(function(o,m){var c=m===q.a?" right":(m===x.ans[j]?" wrong":"");return '<div class="opt'+c+'" style="cursor:default"><i>'+L[m]+'.</i><span>'+o+(m===q.a?" ✓":"")+(m===x.ans[j]&&m!==q.a?" (your answer)":"")+'</span></div>'}).join("")+(x.ans[j]<0?'<div class="note">Not answered.</div>':"")}).join("")+'</div>'})}
 app.innerHTML=h}
function begin(){
 var t={mode:st.mode,ask:false,c:0,fb:false,left:0};
 if(st.mode==="mock"){t.subs=[sb(ENG,60)].concat(st.picks.map(function(n){return sb(n,40)}));t.left=st.mins*60}
 else if(st.mode==="prac"){t.subs=[sb(st.pr,st.pc)];t.fb=true}
 else{var W=ld("kukuW").slice(0,20);var qs=W.map(function(x){return{q:x.q,o:x.o,a:x.a,n:x.n}});t.subs=[{n:"My mistakes",qs:qs,ans:qs.map(function(){return-1}),i:0}];t.fb=true}
 st.t=t;st.v="test";
 if(t.left){tm.hidden=false;tm.textContent=fmt(t.left);tm.className="timer";t.timer=setInterval(function(){t.left--;tm.textContent=fmt(t.left);tm.className="timer"+(t.left<=180?" low":"");if(t.left<=0)end()},1000)}
 render();window.scrollTo(0,0)}
function end(){
 var t=st.t;if(t.timer)clearInterval(t.timer);tm.hidden=true;
 var W=ld("kukuW"),per={},tot=0;
 t.subs.forEach(function(x){per[x.n]=Math.round(pct(x).p);tot+=pct(x).p;x.qs.forEach(function(q,j){var k=q.q;if(x.ans[j]===q.a){if(t.mode==="mist")W=W.filter(function(w){return w.q!==k})}else if(x.ans[j]>-1&&!W.some(function(w){return w.q===k})){W.unshift({q:q.q,o:q.o,a:q.a,n:q.n||x.n})}})});
 sv("kukuW",W.slice(0,100));
 if(t.mode!=="mist"){var R=ld("kukuR");R.unshift({d:new Date().toLocaleDateString(),m:t.mode,s:Math.round(tot*4/t.subs.length),per:per});sv("kukuR",R.slice(0,30))}
 st.v="result";render();window.scrollTo(0,0)}
function share(){
 var u=location.href,d={title:"KUKU CBT TEST",text:"Free JAMB-style CBT practice for all students",url:u};
 if(navigator.share){navigator.share(d).catch(function(){})}
 else if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){st.msg="Link copied. Paste it anywhere to share.";render()},function(){st.msg="Copy this link: "+u;render()})}
 else{st.msg="Copy this link: "+u;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");go(b)});
navEl.addEventListener("click",function(e){var b=e.target.closest("[data-a]");go(b)});
function go(b){
 if(!b)return;var a=b.dataset.a,v=b.dataset.v,t=st.t;
 if(a!=="submit"&&t)t.ask=false;st.msg=a==="share"?st.msg:"";
 if(a==="nav"){st.v=v;if(v==="setup")st.mode=st.mode==="mist"?"mock":st.mode}
 else if(a==="full"){st.mode="mock";st.v="setup"}
 else if(a==="prac"||a==="tprac"){st.mode="prac";st.v="setup"}
 else if(a==="tmock"){st.mode="mock"}
 else if(a==="mist"){if(ld("kukuW").length){st.mode="mist";begin();return}else st.msg="No mistakes saved yet. Take a test first."}
 else if(a==="plan")st.v="plan";
 else if(a==="stream")st.picks=STR[v].slice();
 else if(a==="pick"){var i=st.picks.indexOf(v);if(i>-1)st.picks.splice(i,1);else if(st.picks.length<3)st.picks.push(v)}
 else if(a==="mins")st.mins=+v;
 else if(a==="prsub")st.pr=v;
 else if(a==="pc")st.pc=+v;
 else if(a==="start"){begin();return}
 else if(a==="sylpick")st.syl=v;
 else if(a==="share"){share();return}
 else if(a==="sub")t.c=+v;
 else if(a==="ans"){var s=t.subs[t.c];if(t.fb&&s.ans[s.i]>-1)return;s.ans[s.i]=+v}
 else if(a==="prev")t.subs[t.c].i--;
 else if(a==="next")t.subs[t.c].i++;
 else if(a==="go")t.subs[t.c].i=+v;
 else if(a==="submit"){if(t.ask){end();return}t.ask=true}
 render()}
render();
</script>
</body>
</html>
